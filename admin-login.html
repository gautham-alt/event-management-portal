<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Event Management Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">Event Management Portal</div>
            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#events">Events</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="admin-login.html">Admin Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="login-section">
            <div class="login-card">

                <h2>Admin Login</h2>
                <p class="form-note">Sign in with your administrator credentials to access the dashboard.</p>

                <div id="loginError" class="error-message" role="alert" aria-live="assertive" hidden></div>

                <form id="adminLoginForm" action="#" method="post" novalidate>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
                        <span class="error-message" id="usernameError" aria-live="polite"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                        <span class="error-message" id="passwordError" aria-live="polite"></span>
                    </div>

                    <button type="submit" class="btn btn-block" id="loginBtn">Login</button>

                </form>

                <p class="form-note">Authorized personnel only. Unauthorized access is prohibited.</p>

            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Event Management Portal. All rights reserved.</p>
    </footer>

    <script src="js/admin-login.js"></script>
</body>
</html>
