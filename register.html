</header>

<main>
    <section class="registration-section">

```
    <form class="register-form" id="registerForm" novalidate>

        <h2>Event Registration</h2>

        <p class="form-note">
            Fill in your details below to register for an event.
        </p>

        <div id="successMessage"
             class="success-message"
             hidden>
        </div>

        <div class="form-group">
            <label for="fullName">Full Name</label>

            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name">

            <span id="fullNameError"
                  class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email">

            <span id="emailError"
                  class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number">

            <span id="phoneError"
                  class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="college">College Name</label>

            <input
                type="text"
                id="college"
                placeholder="Enter your college">

            <span id="collegeError"
                  class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="eventSelect">Select Event</label>

            <select id="eventSelect">
                <option value="">Choose an Event</option>
                <option value="hackathon-2026">
                    Hackathon 2026
                </option>
                <option value="tech-talk">
                    Tech Talk
                </option>
                <option value="coding-challenge">
                    Coding Challenge
                </option>
            </select>

            <span id="eventSelectError"
                  class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="eventFee">Event Fee</label>

            <input
                type="text"
                id="eventFee"
                readonly
                placeholder="Fee will appear here">
        </div>

        <div class="form-group">
            <label for="paymentStatus">
                Payment Status
            </label>

            <select id="paymentStatus">
                <option value="Paid">Paid</option>
                <option value="Pending">Pending</option>
            </select>
        </div>

        <button type="submit"
                class="btn btn-block">
            Submit Registration
        </button>

    </form>

</section>
```
